# Pipeline configuration. Paths relative to repo root.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  forecasts_dir: data/forecasts
  # M5 subset for CPU-friendly iteration: one state, top items by revenue.
  stores: ["CA_1", "CA_2"]
  top_items: 200

forecast:
  horizon: 28            # days
  freq: D
  quantiles: [0.1, 0.5, 0.9]

backtest:
  n_windows: 4
  step_size: 28

features:
  lags: [7, 14, 28, 56]
  rolling_windows: [7, 28]

training:
  experiment_name: demandcast
  random_state: 42
  lgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 20

monitoring:
  degradation_threshold: 1.3   # alert when rolling MASE exceeds this
